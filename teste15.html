        }

            color: #1d3b5a;

        }

            height: 28px;
            background: #eef3fa;
            border-radius: 40px;
            text-align: center;
            line-height: 28px;
            font-weight: 700;
            color: #1d4a7c;
            flex-shrink: 0;
        }

            background: #d4edda;
            border-color: #2b8c4a;
            box-shadow: 0 0 0 2px #b7dfc9;
        }
        .option.correct .option-letter {
            background: #2b8c4a;
            color: white;
        }
        .option.wrong {
            background: #f8dddd;
            border-color: #b33c3c;
            box-shadow: 0 0 0 2px #f1caca;
        }
        .option.wrong .option-letter {
            background: #b33c3c;
            color: white;
        }
        .option.disabled-opt {
            cursor: default;
            opacity: 0.8;
        }

            padding: 12px 16px;
            border-radius: 24px;
            background: #eef3fa;
            font-weight: 500;
            color: #153b62;
            min-height: 48px;

            align-items: center;
            gap: 8px;

            color: #0f2d4a;
        }

        .btn-primary:disabled {

        .btn-outline {

            border-color: #bacddb;
        }

            background: #e6eefa;
            border-color: #7f9fc7;
        }
        .btn-success {

            border-color: #1b7e4a;

            background: #2a9a5e;
            border-color: #2a9a5e;

        .btn-danger {

            border-color: #b33c3c;

        </div>
        <div class="footer-note">

    </div>

            </div>
        </div>
    </div>
</div>

            "Ultrapassar pelo acostamento: grave, 5 pontos.",
            "Não dar passagem a veículos de emergência: gravíssima, 7 pontos.",
            "Não reduzir em chuva/neblina: grave, 5 pontos.",
            "Álcool ou drogas: gravíssima, recolhimento CNH, retenção veículo e suspensão.",
            "Celular ao volante: infração média, 4 pontos e multa de R$85,13.",
            "Sem CNH: gravíssima, apreensão do veículo e recolhimento da CNH do proprietário.",
            "CNH cassada/suspensa: gravíssima, apreensão do veículo e recolhimento da CNH do proprietário.",
            "Sem adaptação exigida: gravíssima, retenção do veículo e recolhimento da CNH.",
            "Racha: gravíssima, 7 pontos, apreensão do veículo e recolhimento CNH.",
            "Contramão em via de sentido único: grave, 5 pontos, R$127,69.",
            "Declive com carro desengrenado: média e retenção do veículo.",
            "Ultrapassar pela direita: média, 4 pontos.",
            "Ultrapassar pela esquerda: NÃO é infração (desde que segura)."
        ];

        // ----- ESTADO -----
        let currentIndex = 0;
        const total = GABARITO.length;
        let respostas = new Array(total).fill(null);   // 'A','B','C','D' ou null
        let modoRevisao = false;          // se true, só mostra erros
        let listaRevisao = [];            // índices das questões erradas

        // ----- DOM -----
        const quizMode = document.getElementById('quizMode');
        const resultMode = document.getElementById('resultMode');
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const feedbackMessage = document.getElementById('feedbackMessage');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const finalizarBtn = document.getElementById('finalizarBtn');
        const voltarQuizBtn = document.getElementById('voltarQuizBtn');
        const revisarErrosBtn = document.getElementById('revisarErrosBtn');
        const reiniciarBtn = document.getElementById('reiniciarBtn');
        const questionCounter = document.getElementById('questionCounter');
        const progressBar = document.getElementById('progressBar');
        const progressLabel = document.getElementById('progressLabel');
        const acertosLabel = document.getElementById('acertosLabel');
        const errosLabel = document.getElementById('errosLabel');
        const porcentagemLabel = document.getElementById('porcentagemLabel');
        const gabaritoLista = document.getElementById('gabaritoLista');

        // ----- FUNÇÕES -----
        function updateProgress() {
            const answered = respostas.filter(r => r !== null).length;
            const percent = total > 0 ? (answered / total) * 100 : 0;
            progressBar.style.width = percent + '%';
            progressLabel.textContent = `${answered} de ${total} respondidas`;
        }

        function renderQuestion(index) {
            if (modoRevisao && listaRevisao.length > 0) {
                // se está em modo revisão, usamos a lista de erros
                if (index >= listaRevisao.length) {
                    // fallback: volta pro primeiro erro
                    index = 0;
                    currentIndex = 0;
                }
                const realIndex = listaRevisao[index];
                renderQuizQuestion(realIndex, index);
                questionCounter.textContent = `${index+1} / ${listaRevisao.length} (revisão)`;
                return;
            }
            // modo normal
            renderQuizQuestion(index, index);
            questionCounter.textContent = `${index+1} / ${total}`;
        }

        function renderQuizQuestion(realIndex, displayIndex) {
            const gab = GABARITO[realIndex];
            const respostaSelecionada = respostas[realIndex];
            const opcoes = OPCOES[realIndex];

            // texto
            questionText.textContent = ENUNCIADOS[realIndex];

            // opções
            optionsContainer.innerHTML = '';
            opcoes.forEach((texto, idx) => {
                const letra = String.fromCharCode(65 + idx);
                const div = document.createElement('div');
                div.className = 'option';
                if (respostaSelecionada !== null) {
                    div.classList.add('disabled-opt');
                    if (letra === gab) {
                        div.classList.add('correct');
                    } else if (letra === respostaSelecionada && respostaSelecionada !== gab) {
                        div.classList.add('wrong');
                    }
                }
                div.innerHTML = `<span class="option-letter">${letra}</span> ${texto}`;
                div.dataset.letra = letra;
                div.addEventListener('click', () => handleOptionClick(realIndex, letra));
                optionsContainer.appendChild(div);
            });

            // feedback
            if (respostaSelecionada !== null) {
                const acertou = (respostaSelecionada === gab);
                const emoji = acertou ? '✅' : '❌';
                const msg = acertou ? 'Correto!' : `Resposta correta: ${gab}`;
                feedbackMessage.innerHTML = `${emoji} ${msg}`;
            } else {
                feedbackMessage.innerHTML = '💡 Selecione uma alternativa';
            }

            // botoes
            if (modoRevisao && listaRevisao.length > 0) {
                prevBtn.disabled = (displayIndex === 0);
                nextBtn.disabled = (displayIndex === listaRevisao.length - 1);
            } else {
                prevBtn.disabled = (realIndex === 0);
                nextBtn.disabled = (realIndex === total - 1);
            }

            updateProgress();
        }

        function handleOptionClick(realIndex, letra) {
            if (respostas[realIndex] !== null) return;
            respostas[realIndex] = letra;
            // re-renderiza
            if (modoRevisao && listaRevisao.length > 0) {
                const pos = listaRevisao.indexOf(realIndex);
                if (pos !== -1) {
                    renderQuestion(pos);
                } else {
                    // fallback: recarrega normal
                    renderQuestion(currentIndex);
                }
            } else {
                renderQuestion(currentIndex);
            }
        }

        function goTo(index) {
            if (modoRevisao && listaRevisao.length > 0) {
                if (index < 0 || index >= listaRevisao.length) return;
                currentIndex = index;
                renderQuestion(index);
            } else {
                if (index < 0 || index >= total) return;
                currentIndex = index;
                renderQuestion(index);
            }
        }

        // ----- GERAR GABARITO (painel de resultados) -----
        function showResult() {
            // estatísticas
            let acertos = 0, erros = 0;
            const detalhes = [];
            for (let i = 0; i < total; i++) {
                const resp = respostas[i];
                const gab = GABARITO[i];
                let status = 'nao-respondida';
                let acertou = false;
                if (resp !== null) {
                    if (resp === gab) {
                        acertos++;
                        status = 'acertou';
                        acertou = true;
                    } else {
                        erros++;
                        status = 'errou';
                        acertou = false;
                    }
                } else {
                    status = 'nao-respondida';
                }
                detalhes.push({
                    index: i,
                    enunciado: ENUNCIADOS[i],
                    suaResposta: resp,
                    gabarito: gab,
                    status: status,
                    acertou: acertou,
                    dica: DICAS[i] || 'Revise o assunto.'
                });
            }

            // atualiza labels
            acertosLabel.textContent = `✅ ${acertos}`;
            errosLabel.textContent = `❌ ${erros}`;
            const percent = total > 0 ? Math.round((acertos / total) * 100) : 0;
            porcentagemLabel.textContent = `${percent}%`;

            // monta lista
            gabaritoLista.innerHTML = '';
            detalhes.forEach(item => {
                const div = document.createElement('div');
                div.className = 'gabarito-item';

                const icon = document.createElement('span');
                icon.className = 'status-icon';
                if (item.status === 'acertou') icon.textContent = '✅';
                else if (item.status === 'errou') icon.textContent = '❌';
                else icon.textContent = '⬜';

                const qnum = document.createElement('span');
                qnum.className = 'qnum';
                qnum.textContent = `Q${item.index+1}`;

                const respSpan = document.createElement('span');
                respSpan.className = 'resposta';
                if (item.suaResposta) {
                    respSpan.textContent = `Sua: ${item.suaResposta}  |  Gab: ${item.gabarito}`;
                    if (item.acertou) respSpan.classList.add('correta');
                    else respSpan.classList.add('errada');
                } else {
                    respSpan.textContent = `Gab: ${item.gabarito} (não respondeu)`;
                    respSpan.style.background = '#f0f0f0';
                }

                const dicaSpan = document.createElement('span');
                dicaSpan.className = 'dica';
                dicaSpan.textContent = `💡 ${item.dica}`;

                div.appendChild(icon);
                div.appendChild(qnum);
                div.appendChild(respSpan);
                div.appendChild(dicaSpan);
                gabaritoLista.appendChild(div);
            });

            // alterna visibilidade
            quizMode.classList.add('hidden');
            resultMode.classList.remove('hidden');
        }

        // ----- REVISAR ERROS -----
        function entrarModoRevisao() {
            const errosIndices = [];
            for (let i = 0; i < total; i++) {
                if (respostas[i] !== null && respostas[i] !== GABARITO[i]) {
                    errosIndices.push(i);
                }
            }
            if (errosIndices.length === 0) {
                alert('🎉 Parabéns! Você não errou nenhuma questão. Revisão não necessária.');
                return;
            }
            listaRevisao = errosIndices;
            modoRevisao = true;
            currentIndex = 0;
            // volta pro modo quiz
            resultMode.classList.add('hidden');
            quizMode.classList.remove('hidden');
            renderQuestion(0);
        }

        // ----- REINICIAR -----
        function reiniciarTeste() {
            if (confirm('Deseja reiniciar o teste? Todas as respostas serão apagadas.')) {
                respostas.fill(null);
                modoRevisao = false;
                listaRevisao = [];
                currentIndex = 0;
                resultMode.classList.add('hidden');
                quizMode.classList.remove('hidden');
                renderQuestion(0);
            }
        }

        // ----- EVENTOS -----
        prevBtn.addEventListener('click', () => {
            if (modoRevisao && listaRevisao.length > 0) {
                if (currentIndex > 0) goTo(currentIndex - 1);
            } else {
                if (currentIndex > 0) goTo(currentIndex - 1);
            }
        });

        nextBtn.addEventListener('click', () => {
            if (modoRevisao && listaRevisao.length > 0) {
                if (currentIndex < listaRevisao.length - 1) goTo(currentIndex + 1);
            } else {
                if (currentIndex < total - 1) goTo(currentIndex + 1);
            }
        });

        finalizarBtn.addEventListener('click', showResult);

        voltarQuizBtn.addEventListener('click', () => {
            modoRevisao = false;
            listaRevisao = [];
            currentIndex = 0;
            resultMode.classList.add('hidden');
            quizMode.classList.remove('hidden');
            renderQuestion(0);
        });

        revisarErrosBtn.addEventListener('click', entrarModoRevisao);

        reiniciarBtn.addEventListener('click', reiniciarTeste);

        // ----- INICIALIZA -----
        renderQuestion(0);
    })();
</script>
</body>
</html>
